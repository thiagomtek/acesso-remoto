<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Acesso Remoto — Entrar</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="title">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div>
      <div class="heading"><p class="eyebrow">Transação</p><h1 id="title">Acesso Remoto</h1><p>Entre para acessar somente as máquinas da sua conta.</p></div>
      <form id="auth" novalidate>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="nome@empresa.com">
        <label for="password">Senha</label>
        <div class="password-field"><input id="password" name="password" type="password" required minlength="7" autocomplete="current-password" placeholder="Sua senha"><button type="button" id="show-password" class="show">Mostrar</button></div>
        <p id="error" class="error" role="alert" hidden></p>
        <button class="primary" type="submit">Entrar</button>
        <div class="divider"><span>ou</span></div>
        <button class="secondary" type="button" id="register">Criar uma conta</button>
      </form>
      <p class="privacy">Sua senha nunca é enviada aos agentes.</p>
    </section>
  </main>
  <script src="login.js" type="module"></script>
</body>
</html>
