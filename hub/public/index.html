<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Acesso Remoto</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </span>
      <span class="brand-name">Acesso Remoto</span>
    </div>
    <span class="pill" id="conn" data-state="wait"><span class="pill-dot"></span><span id="conn-text">conectando…</span></span>
    <div class="grow"></div>
    <div class="header-actions">
      <div id="teams-slot"></div>
      <a class="btn header-download" href="/api/agent-installer" download="transacao-agent-instalador.zip" title="Baixar o agente vinculado a esta conta">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 21h14"/></svg>
        <span>Baixar agente</span>
      </a>
      <div class="account-box">
        <button class="account-profile" id="account-settings" type="button" title="Gerenciar minha conta" aria-label="Gerenciar minha conta e alterar senha">
          <span class="account-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          </span>
          <span class="account-copy"><span class="account-label">Minha conta</span><span class="who" id="who" title="Usuário autenticado">carregando…</span></span>
        </button>
        <button class="btn ghost logout" id="logout" type="button" title="Sair desta conta" aria-label="Sair desta conta">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></svg>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="page">
  <section class="toolbar" aria-label="Filtros">
    <div class="toolbar-title">
      <h1>Máquinas</h1>
      <div class="summary" id="summary"></div>
    </div>
    <div class="toolbar-controls">
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscar máquina…" autocomplete="off" aria-label="Buscar máquina">
      </label>
      <div class="segmented" id="filters" role="tablist" aria-label="Filtrar por estado">
        <button role="tab" data-filter="all" aria-selected="true">Todas</button>
        <button role="tab" data-filter="online" aria-selected="false">Online</button>
        <button role="tab" data-filter="offline" aria-selected="false">Offline</button>
        <button role="tab" data-filter="pending" aria-selected="false">Novas</button>
      </div>
    </div>
  </section>

  <div id="notices" aria-live="polite"></div>
  <div id="list" class="grid"></div>
</main>

<div class="account-modal" id="account-modal" hidden>
  <button class="account-backdrop" type="button" data-account-close aria-label="Fechar configurações da conta"></button>
  <section class="account-dialog" role="dialog" aria-modal="true" aria-labelledby="account-title">
    <header class="account-head">
      <div><p class="account-eyebrow">Segurança</p><h2 id="account-title">Minha conta</h2></div>
      <button class="btn ghost account-close" type="button" data-account-close aria-label="Fechar">×</button>
    </header>
    <form id="password-form" class="account-form">
      <label>E-mail<input id="account-email" type="email" readonly></label>
      <div class="account-separator"></div>
      <h3>Alterar senha</h3>
      <label>Senha atual<input id="current-password" type="password" autocomplete="current-password" required></label>
      <label>Nova senha<input id="new-password" type="password" autocomplete="new-password" minlength="7" maxlength="200" required></label>
      <label>Confirmar nova senha<input id="confirm-password" type="password" autocomplete="new-password" minlength="7" maxlength="200" required></label>
      <p class="account-message" id="account-message" role="status" aria-live="polite"></p>
      <div class="account-form-actions">
        <button class="btn ghost" type="button" data-account-close>Cancelar</button>
        <button class="btn primary" id="save-password" type="submit">Salvar nova senha</button>
      </div>
    </form>
  </section>
</div>
<script src="app.js" type="module"></script>
</body>
</html>
